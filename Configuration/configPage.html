<!DOCTYPE html>
<html lang="it">
<head><meta charset="utf-8"><title>YouTube Audio Downloader</title></head>
<body>
<div id="youtubeAudioPage" data-role="page" class="page type-interior pluginConfigurationPage">
  <div data-role="content"><div class="content-primary">
    <form id="youtubeAudioForm">
      <h1>YouTube Audio Downloader</h1>
      <p>Le destinazioni sono già impostate per il container Jellyfin:</p>
      <ul><li>Musica: <code>/Media/Musica</code></li><li>Podcast: <code>/Media/Podcast</code></li></ul>
      <input id="MusicDestination" type="hidden" value="/Media/Musica">
      <input id="PodcastDestination" type="hidden" value="/Media/Podcast">
      <button type="submit">Salva configurazione</button>
    </form>
    <hr>
    <form id="requestForm">
      <h2>Nuova richiesta</h2>
      <label>URL YouTube<input id="sourceUrl" type="url" required></label>
      <label>Categoria<select id="category" required><option value="">Scegli...</option><option value="Music">Musica</option><option value="Podcast">Podcast</option></select></label>
      <button type="submit">Analizza e avvia</button>
    </form>
    <div id="requests"></div>
  </div></div>
</div>
<script>
(function () {
  const page = document.querySelector('#youtubeAudioPage');
  page.addEventListener('pageshow', loadConfig);
  document.querySelector('#youtubeAudioForm').addEventListener('submit', saveConfig);
  document.querySelector('#requestForm').addEventListener('submit', createRequest);
  async function loadConfig() { document.querySelector('#MusicDestination').value='/Media/Musica'; document.querySelector('#PodcastDestination').value='/Media/Podcast'; refresh(); }
  async function saveConfig(e) { e.preventDefault(); try { const c=await ApiClient.getPluginConfiguration('8c1c54f0-2df1-4e8d-9e34-0c5d4f2cbb20'); c.MusicDestination='/Media/Musica'; c.PodcastDestination='/Media/Podcast'; await ApiClient.updatePluginConfiguration('8c1c54f0-2df1-4e8d-9e34-0c5d4f2cbb20',c); Dashboard.alert('Destinazioni fisse: /Media/Musica e /Media/Podcast'); } catch (error) { Dashboard.alert('Impossibile salvare la configurazione: '+error); } }
  async function createRequest(e) { e.preventDefault(); try { await ApiClient.ajax({type:'POST',url:ApiClient.getUrl('YouTubeAudio/requests'),data:JSON.stringify({url:document.querySelector('#sourceUrl').value,category:document.querySelector('#category').value}),contentType:'application/json',dataType:'json'}); Dashboard.alert('Download iniziato: richiesta messa in coda.'); refresh(); } catch (error) { Dashboard.alert('Download non avviato: '+error); } }
  async function refresh() { try { const data=await ApiClient.getJSON(ApiClient.getUrl('YouTubeAudio/requests')); const requestsElement=document.querySelector('#requests'); requestsElement.innerHTML=data.map(r=>'<section><h3>'+escapeHtml(r.url)+'</h3>'+(r.items.length===0?'<p><strong>Analisi in corso…</strong></p>':r.items.map(i=>'<p><strong>'+statusLabel(i.status)+'</strong> — '+escapeHtml(i.title)+' ('+i.progress+'%)'+(i.finalPath?' — file: <code>'+escapeHtml(i.finalPath)+'</code>':'')+(i.error?' — errore: '+escapeHtml(i.error):'')+'</p>').join(''))+'</section>').join(''); } catch (error) { console.error('YouTube Audio: impossibile leggere le richieste', error); } finally { setTimeout(refresh,3000); } }
  function statusLabel(status) { return ({Pending:'In coda',Processing:'Download in corso',Completed:'Download completato',Failed:'Download fallito'}[status]||status); }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
})();
</script>
</body></html>
